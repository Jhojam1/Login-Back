# =============================================================================
#  CI/CD: construye las imagenes, las publica en Docker Hub y despliega en EC2.
#
#  NINGUNA credencial esta escrita aqui. Todas se leen de los secretos del
#  repositorio (Settings -> Secrets and variables -> Actions):
#
#    DOCKERHUB_USERNAME   tu usuario de Docker Hub
#    DOCKERHUB_TOKEN      token de acceso (Docker Hub -> Account settings ->
#                         Personal access tokens). NO uses tu contrasena.
#
#  Y para el despliegue automatico (opcional, ver el job "deploy"):
#    EC2_HOST             IP publica de la instancia
#    EC2_USER             usuario SSH, normalmente "ubuntu"
#    EC2_SSH_KEY          contenido COMPLETO del archivo auth-key.pem
#
#  Imagenes que publica, en el repositorio "login" de Docker Hub:
#    <usuario>/login:backend-latest
#    <usuario>/login:frontend-latest
# =============================================================================
name: Docker image

on:
  push:
    branches: [main]
    # Cambios que no afectan al codigo no disparan una construccion completa
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:   # Permite lanzarlo a mano desde la pestana Actions

jobs:
  # ---------------------------------------------------------------------------
  #  1. Pruebas del backend
  #
  #  Va en un job aparte para que, si algo falla, se vea que fue una prueba y no
  #  la construccion de la imagen. Ademas corta el proceso antes de publicar nada.
  # ---------------------------------------------------------------------------
  test:
    name: Pruebas del backend
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar las pruebas
        working-directory: ./backend
        run: mvn -B -ntp test

  # ---------------------------------------------------------------------------
  #  2. Construir y publicar las dos imagenes
  #
  #  La matriz ejecuta los mismos pasos para backend y frontend, en paralelo y
  #  sin duplicar el codigo del workflow.
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Imagen de ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: test

    strategy:
      fail-fast: false   # Si falla una imagen, la otra termina igualmente
      matrix:
        service: [backend, frontend]

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      # Buildx habilita la cache de capas entre ejecuciones, que es lo que hace
      # que la segunda construccion tarde la mitad.
      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Comprueba que los secretos llegan antes de intentar el login, para que el
      # fallo diga QUE falta en lugar del escueto "Username and password required".
      # Los valores se pasan por env y nunca se imprimen: solo su longitud.
      - name: Comprobar los secretos de Docker Hub
        env:
          USUARIO: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          falta=0
          if [ -z "$USUARIO" ]; then
            echo "::error::El secreto DOCKERHUB_USERNAME esta vacio o no existe"
            falta=1
          fi
          if [ -z "$TOKEN" ]; then
            echo "::error::El secreto DOCKERHUB_TOKEN esta vacio o no existe"
            falta=1
          fi
          if [ "$falta" -eq 1 ]; then
            echo ""
            echo "Revisa en: Settings > Secrets and variables > Actions"
            echo "  1. Que esten en la pestana SECRETS, no en VARIABLES"
            echo "  2. Que sean 'Repository secrets', no 'Environment secrets'"
            echo "  3. Que el nombre este escrito exactamente igual, sin espacios"
            exit 1
          fi
          echo "Secretos presentes: usuario de ${#USUARIO} caracteres, token de ${#TOKEN}."

      - name: Entrar en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/login:${{ matrix.service }}-latest
            ${{ secrets.DOCKERHUB_USERNAME }}/login:${{ matrix.service }}-${{ github.sha }}
          # Cache de capas en el propio GitHub, no en Docker Hub: acelera las
          # construcciones siguientes sin ensuciar el repositorio con etiquetas
          # tecnicas que no son imagenes desplegables.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # ---------------------------------------------------------------------------
  #  3. Desplegar en el EC2
  #
  #  Entra por SSH, descarga las imagenes nuevas y reinicia los contenedores.
  #
  #  Esta apagado hasta que lo actives: Settings -> Secrets and variables ->
  #  Actions -> pestana "Variables" -> New variable -> DEPLOY_ENABLED = true
  #  Asi la parte de CI funciona desde el primer dia aunque el EC2 no exista aun.
  # ---------------------------------------------------------------------------
  deploy:
    name: Desplegar en EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: vars.DEPLOY_ENABLED == 'true'

    steps:
      - name: Conectar por SSH y actualizar los contenedores
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # El nombre correcto es script_stop, en singular: con "script_stops" GitHub
          # avisa de parametro desconocido y la opcion no se aplica.
          script_stop: true
          # Las credenciales viajan como variables de entorno de la sesion SSH y no
          # como texto dentro del script: asi no aparecen en el log de la ejecucion.
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,COMPOSE_URL
          script: |
            set -e

            # Comprobaciones previas: sin ellas, un archivo que falta produce errores
            # cripticos como "invalid reference format" en lugar de decir que pasa.
            if [ ! -d ~/login-deploy ]; then
              echo "ERROR: no existe la carpeta ~/login-deploy en el servidor."
              echo "Creala siguiendo el paso 3 de la guia de despliegue."
              exit 1
            fi

            cd ~/login-deploy

            if [ ! -f docker-compose.yml ]; then
              echo "ERROR: falta docker-compose.yml en ~/login-deploy"
              exit 1
            fi

            if [ ! -f .env ]; then
              echo "ERROR: falta el archivo .env en ~/login-deploy"
              echo ""
              echo "Es el que dice que imagenes bajar y con que credenciales."
              echo "Generalo entrando por SSH al servidor y ejecutando:"
              echo "    cd ~/login-deploy && bash configurar.sh"
              exit 1
            fi

            if ! grep -q '^IMAGE_REPO=.\+' .env; then
              echo "ERROR: el .env existe pero no define IMAGE_REPO."
              echo "Debe contener una linea como:  IMAGE_REPO=tu-usuario/login"
              exit 1
            fi

            # Solo hace falta si el repositorio de Docker Hub es privado
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            # El docker-compose.yml vive en el servidor, no dentro de las imagenes, asi
            # que sin esto se quedaria congelado en la version del dia que se instalo:
            # cualquier cambio en el compose no llegaria nunca y daria fallos muy raros.
            # Se descarga la version EXACTA de este commit, para que compose e imagenes
            # vayan siempre a la par.
            echo "Actualizando docker-compose.yml desde el repositorio..."
            cp docker-compose.yml docker-compose.yml.anterior
            if curl -fsSL -o docker-compose.yml.nuevo "$COMPOSE_URL"; then
              mv docker-compose.yml.nuevo docker-compose.yml
            else
              rm -f docker-compose.yml.nuevo
              echo "AVISO: no se pudo descargar el compose nuevo (repositorio privado?)."
              echo "       Se sigue con el que ya habia en el servidor."
            fi

            docker compose pull

            # Si el arranque falla, se imprimen los registros del backend: sin esto el
            # log de GitHub solo diria "container is unhealthy", que no explica nada.
            if ! docker compose up -d --remove-orphans; then
              echo ""
              echo "===== EL ARRANQUE FALLO. Ultimas lineas del backend ====="
              docker compose logs backend --tail 60 2>&1 || true
              echo "========================================================"
              exit 1
            fi

            # Borra las imagenes viejas que quedan sin usar; en un disco de 30 GB
            # se llenan rapido si se acumula una por despliegue.
            docker image prune -f

            docker compose ps
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          # Version exacta de este commit, para que compose e imagenes coincidan
          COMPOSE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/deploy/docker-compose.yml
