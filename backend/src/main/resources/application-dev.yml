# ============================================================================
#  Perfil DEV: para trabajar en tu equipo sin instalar ninguna base de datos.
#  Usa H2 en memoria, asi que los datos se borran al apagar la aplicacion.
#  Arranque:  mvn spring-boot:run
# ============================================================================
spring:
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console   # Explorador web de la base: http://localhost:8080/h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop   # Crea las tablas al arrancar y las borra al cerrar
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

logging:
  level:
    com.proyecto.auth: DEBUG
    org.hibernate.SQL: DEBUG

# ============================================================================
#  El correo de verificacion se envia DE VERDAD tambien en este perfil.
#
#  El perfil dev solo cambia la base de datos (H2 en memoria en lugar de
#  PostgreSQL); el envio del codigo funciona igual que en produccion, porque es
#  justo lo que hay que poder probar.
#
#  Requisito: que haya credenciales de AWS disponibles. En el EC2 las aporta el
#  rol IAM de la instancia sin configurar nada. En un portatil hace falta
#  ejecutar "aws configure" una vez.
#
#  Si trabajas en local sin credenciales y prefieres que el codigo salga por el
#  log en lugar de fallar el login, descomenta estas dos lineas:
#
# app:
#   lambda:
#     enabled: false
# ============================================================================
