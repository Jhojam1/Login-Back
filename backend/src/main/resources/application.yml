# ============================================================================
#  Configuracion comun a todos los entornos.
#  Los valores entre ${} se leen de variables de entorno; el texto tras los dos
#  puntos es el valor por defecto si la variable no existe.
# ============================================================================
spring:
  application:
    name: auth-service

  # Lee un archivo .env junto a donde se arranca la aplicacion (la carpeta backend/),
  # con lineas CLAVE=valor. Asi las credenciales de la base de datos se escriben en un
  # solo sitio, fuera del codigo y fuera de Git (.env esta en el .gitignore).
  # "optional:" hace que, si el archivo no existe, se arranque igual con los valores por
  # defecto. Las variables de entorno reales del sistema tienen prioridad sobre el .env.
  config:
    import: optional:file:.env[.properties]

  # Perfil activo: dev (H2 en memoria) o prod (PostgreSQL). Se elige con la variable
  # SPRING_PROFILES_ACTIVE, ya sea en el .env o en el entorno del servidor.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jackson:
    # Las fechas viajan como texto ISO-8601 (2026-11-14T10:30:00Z) y no como numeros,
    # que es lo que espera JavaScript al hacer new Date(...)
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  jpa:
    open-in-view: false   # Evita mantener la sesion de Hibernate abierta durante el render
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never       # No se filtran mensajes internos al cliente
    include-stacktrace: never
  # Necesario cuando la aplicacion esta detras de Nginx o de un balanceador de AWS,
  # para que Spring vea el esquema y la IP reales y no los del proxy
  forward-headers-strategy: framework

# ============================================================================
#  Configuracion propia de la aplicacion
# ============================================================================
app:
  jwt:
    # IMPORTANTE: en produccion este valor DEBE venir de una variable de entorno.
    # Minimo 32 caracteres (256 bits) por exigencia del algoritmo HMAC-SHA256.
    secret: ${APP_JWT_SECRET:clave-de-desarrollo-cambiar-en-produccion-1234567890}
    issuer: auth-service
    access-token-expiration-ms: ${APP_JWT_ACCESS_MS:900000}        # 15 minutos
    refresh-token-expiration-ms: ${APP_JWT_REFRESH_MS:604800000}   # 7 dias

  security:
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    max-failed-attempts: 5
    lock-duration-minutes: 15
    # Clave compartida que deben enviar los microservicios aliados (servicio de S3)
    # en la cabecera X-Service-Key para usar /api/v1/auth/introspect
    service-api-key: ${APP_SERVICE_API_KEY:}
    bcrypt-strength: 12


  # ============================================================================
  #  Verificacion en dos pasos por correo
  #
  #  Al iniciar sesion se envia un codigo al correo de la persona y no se entregan
  #  los tokens hasta que lo escribe. El envio lo hace una funcion Lambda que
  #  mantiene otro equipo; aqui solo se la invoca.
  #
  #  Viene activado. El perfil dev apaga la llamada a AWS (ver application-dev.yml)
  #  para poder trabajar en local sin credenciales.
  # ============================================================================
  mfa:
    enabled: true
    code-length: 6
    expiration-minutes: 10
    max-attempts: 5
    resend-cooldown-seconds: 60

  lambda:
    enabled: true
    function-name: arn:aws:lambda:us-east-2:366101997342:function:lambda-envio-codigos
    region: us-east-2
    # Nombres de los campos del JSON que recibe la funcion
    email-field: correo
    code-field: codigo
    timeout-seconds: 10

  admin:
    enabled: ${APP_ADMIN_ENABLED:true}
    username: ${APP_ADMIN_USERNAME:admin}
    email: ${APP_ADMIN_EMAIL:admin@proyecto.com}
    password: ${APP_ADMIN_PASSWORD:Admin.2026}

# ============================================================================
#  Health check que consultara el balanceador de carga de AWS
# ============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.proyecto.auth: ${LOG_LEVEL:INFO}
